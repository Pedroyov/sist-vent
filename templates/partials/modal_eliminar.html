{% comment %}
Modal de confirmación reutilizable. Uso en un botón:
  data-bs-toggle="modal" data-bs-target="#modalEliminar"
  data-url="(url del POST de eliminar)" data-mensaje="¿Eliminar X?"
{% endcomment %}
<div class="modal fade" id="modalEliminar" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered">
    <form method="post" class="modal-content" id="modalEliminarForm">
      {% csrf_token %}
      <div class="modal-header">
        <h5 class="modal-title"><i class="bi bi-exclamation-triangle text-danger me-2"></i>Confirmar</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button>
      </div>
      <div class="modal-body" id="modalEliminarMensaje">¿Seguro que deseas eliminar este registro?</div>
      <div class="modal-footer">
        <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancelar</button>
        <button type="submit" class="btn btn-danger"><i class="bi bi-trash me-1"></i>Eliminar</button>
      </div>
    </form>
  </div>
</div>
