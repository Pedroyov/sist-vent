<div class="modal fade" id="{{ id }}" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered">
    <form method="post" class="modal-content">{% csrf_token %}
      <div class="modal-header"><h5 class="modal-title">{{ titulo }}: <span class="m-nombre"></span></h5><button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button></div>
      <div class="modal-body"><p class="small">{{ texto }}</p>
        <input type="text" name="motivo" class="form-control" maxlength="200" {% if not opcional %}required{% endif %} placeholder="Motivo{% if opcional %} (opcional){% endif %}"></div>
      <div class="modal-footer"><button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancelar</button><button class="btn btn-danger">{{ boton }}</button></div>
    </form>
  </div>
</div>
