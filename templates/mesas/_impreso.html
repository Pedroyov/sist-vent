{% load sis %}<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block titulo %}{% endblock %}</title>
<style>
  body { font-family: ui-monospace, Consolas, monospace; font-size: 13px; max-width: 340px; margin: 1rem auto; color: #000; }
  .c { text-align: center; } .r { text-align: right; white-space: nowrap; } table { width: 100%; } td { vertical-align: top; padding: 1px 0; }
  .linea { border-top: 1px dashed #000; margin: .5rem 0; } .grande { font-size: 1.3em; font-weight: bold; }
  .acciones { margin: 1rem 0; display: flex; gap: .5rem; } .acciones a, .acciones button { flex: 1; padding: .7rem; font-size: 1rem; }

<body>
{% block contenido %}{% endblock %}
<div class="acciones"><button onclick="window.print()">Imprimir</button><a href="{% url 'mesas:cuenta' c.pk %}">Volver</a></div>
