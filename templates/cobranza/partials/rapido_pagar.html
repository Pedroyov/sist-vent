<li class="list-group-item bg-primary-subtle js-pagar" id="fila-{{ c.pk }}" data-texto="{{ c.alumno.nombre_completo|lower }} {{ c.alumno.numero_documento }}">
  <div class="fw-semibold mb-2">{{ c.alumno.apellidos }}, {{ c.alumno.nombres }} <span class="fw-normal text-body-secondary">· {{ c.concepto }}</span></div>
  {% if error %}<div class="alert alert-danger py-1 px-2 small mb-2">{{ error }}</div>{% endif %}
  <div class="row g-2 align-items-end" id="pagar-{{ c.pk }}">
    <div class="col-6 col-md-2">
      <label class="form-label small mb-0">Monto</label>
      <div class="input-group input-group-sm">
        <span class="input-group-text">S/</span>
        <input type="number" step="0.01" min="0" max="{{ c.saldo }}" inputmode="decimal" name="monto" class="form-control"
               value="{% if monto %}{{ monto }}{% else %}{{ c.saldo|stringformat:'.2f' }}{% endif %}" autofocus>
      </div>
    </div>
    {% if config.mora_activa %}
    <div class="col-6 col-md-2">
      <label class="form-label small mb-0">Mora</label>
      <div class="input-group input-group-sm">
        <span class="input-group-text">S/</span>
        <input type="number" step="0.01" min="0" inputmode="decimal" name="mora" class="form-control"
               value="{% if mora %}{{ mora }}{% else %}{{ c.mora_hoy|stringformat:'.2f' }}{% endif %}">
      </div>
    </div>
    {% endif %}
    <div class="col-6 col-md-3">
      <label class="form-label small mb-0">Método</label>
      <select name="metodo" class="form-select form-select-sm"
              onchange="document.getElementById('op-{{ c.pk }}').classList.toggle('d-none', this.value === 'EFE')">
        {% for valor, texto in metodos %}<option value="{{ valor }}" {% if valor == metodo %}selected{% endif %}>{{ texto }}</option>{% endfor %}
      </select>
    </div>
    <div class="col-6 col-md-3 {% if not metodo or metodo == 'EFE' %}d-none{% endif %}" id="op-{{ c.pk }}">
      <label class="form-label small mb-0">N° operación</label>
      <input type="text" name="numero_operacion" value="{{ operacion|default:'' }}" class="form-control form-control-sm" inputmode="numeric">
    </div>
    <div class="col-12 col-md d-flex gap-1 justify-content-end">
      <button type="button" class="btn btn-sm btn-outline-secondary"
              hx-get="{% url 'cobranza:rapido_form' c.pk %}?cancelar=1" hx-target="#fila-{{ c.pk }}" hx-swap="outerHTML">Cancelar</button>
      <button type="button" class="btn btn-sm btn-success js-btn-pagar"
              hx-post="{% url 'cobranza:rapido_pagar' c.pk %}" hx-include="#pagar-{{ c.pk }}" hx-target="#fila-{{ c.pk }}" hx-swap="outerHTML"
              hx-disabled-elt="this">
        <i class="bi bi-check2-circle me-1"></i>Registrar
      </button>
    </div>
  </div>
</li>
