{% load sis %}<li class="list-group-item bg-success-subtle" id="fila-{{ c.pk }}" data-texto="{{ c.alumno.nombre_completo|lower }} {{ c.alumno.numero_documento }}">
  <div class="d-flex align-items-center gap-2">
    <i class="bi bi-check-circle-fill text-success fs-5"></i>
    <div class="flex-grow-1" style="min-width: 0">
      <div class="fw-semibold text-truncate">{{ c.alumno.apellidos }}, {{ c.alumno.nombres }}</div>
      <div class="small">
        Pagó {{ pago.total|soles }} · {{ pago.get_metodo_display }} · recibo N° {{ pago.numero_texto }}
        {% if c.saldo %}<span class="text-warning-emphasis">· aún debe {{ c.saldo|soles }}</span>{% endif %}
      </div>
    </div>
    <a href="{% url 'cobranza:recibo' pago.pk %}" target="_blank" class="btn btn-sm btn-outline-success text-nowrap"><i class="bi bi-receipt"></i> Recibo</a>
  </div>
</li>
