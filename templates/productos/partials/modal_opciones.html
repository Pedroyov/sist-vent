{% comment %}Cuadro para elegir variante y opciones de un producto (punto de venta y mesas). Lo maneja static/js/opciones.js.{% endcomment %}
<div class="modal fade" id="m-opciones" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered modal-dialog-scrollable modal-fullscreen-sm-down">
    <div class="modal-content">
      <div class="modal-header"><h5 class="modal-title" id="op-titulo"></h5><button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button></div>
      <div class="modal-body" id="op-cuerpo"></div>
      <div class="modal-footer">
        <div class="me-auto small text-danger" id="op-falta"></div>
        <button type="button" class="btn btn-primary btn-lg" id="op-agregar"><i class="bi bi-plus-lg me-1"></i>Agregar <span id="op-precio"></span></button>
      </div>
    </div>
  </div>
</div>
