{% if alumno.foto %}
<img src="{{ alumno.foto.url }}" alt="" width="{{ size }}" height="{{ size }}" class="rounded-circle object-fit-cover flex-shrink-0">
{% else %}
<span class="rounded-circle d-inline-flex align-items-center justify-content-center flex-shrink-0 fw-semibold
             {% if alumno.sexo == 'F' %}text-bg-danger bg-opacity-75{% else %}text-bg-primary bg-opacity-75{% endif %}"
      style="width: {{ size }}px; height: {{ size }}px; font-size: calc({{ size }}px / 2.6)">{{ alumno.iniciales }}</span>
{% endif %}
